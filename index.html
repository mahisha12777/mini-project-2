<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Rock-Paper-Scissors</h1>
        <div id="btn-container">
            <button onclick="playerChoice('Rock')">🪨</button>
            <button onclick="playerChoice('Paper')">📃</button>
            <button onclick="playerChoice('Scissor')">✂️</button>
        </div>
        <p>Computer Choice: <span id="computer-choice"></span></p>
        <h3 id="result">-</h3>
        <p>Player Score:<span id="player-score">0</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
